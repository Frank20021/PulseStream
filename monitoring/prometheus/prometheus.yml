global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingestion-api
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-api:8000"]

  - job_name: analytics-api
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-api:8001"]

  - job_name: event-consumer
    metrics_path: /
    static_configs:
      - targets: ["event-consumer:8002"]
