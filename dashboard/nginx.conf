server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    location /api/ {
        proxy_pass http://${ANALYTICS_HOST}:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
